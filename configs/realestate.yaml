name: realestate
description: Аналитик рынка недвижимости СПб и ЛО

extraction_rules:
  entities: [тип_объекта, цена, срок_сдачи, застройщик, локация, риск]
  document_types: [ДДУ, договор, проектная_декларация, объявление, новость]
  signals_positive:
    - старт продаж
    - пресейл
    - закрытые продажи
    - бронь
    - скидка
    - субсидированная ставка
    - рассрочка
    - переуступка
    - ниже рынка
    - метро
    - купил участок
    - КРТ
    - ГПЗУ
    - разрешение на строительство
    - эскроу
    - проектная декларация
    - арендный поток
  signals_risk:
    - перенос срока
    - суд
    - банкротство
    - долгострой
    - обременение
    - прокуратура
    - изъятие
    - снос
    - промзона
    - ЛЭП
    - апартаменты

scoring:
  city_match: 12
  positive_max: 28
  early_entry: 18
  future_project: 16
  finance: 10
  location: 8
  commercial: 8
  price: 5
  news: 4
  risk_max: -25
  thresholds:
    base: 45
    alert: 70
    urgent: 80

output:
  - управленческая_карточка
  - broker_arguments
  - marketing_hook